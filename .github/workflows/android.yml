name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Aviso de firma
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Sin SIGNING_KEYSTORE_BASE64, el APK se firma con una clave debug efímera y no se podrá actualizar sobre una instalación previa."

      - name: Tests y build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee build.log

      - name: Reportar errores
        if: failure()
        run: |
          grep -E "^e: " build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          for f in app/build/test-results/*/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for case in root.iter("testcase"):
              for fail in list(case.iter("failure")) + list(case.iter("error")):
                  msg = (fail.get("message") or fail.text or "").splitlines()[0][:300]
                  print(f"::error::{case.get('classname')}.{case.get('name')}: {msg}")
          PY
          done

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "bitacora-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-${{ github.run_number }}
          path: bitacora-${{ github.run_number }}.apk
          retention-days: 30

      - name: Publicar release
        if: env.HAS_KEYSTORE == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Bitácora ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          make_latest: true
          files: bitacora-${{ github.run_number }}.apk

      - name: Limpiar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
