name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint y APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Preparar keystore de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Aviso de firma
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Sin SIGNING_KEYSTORE_BASE64, el APK se firma con una clave debug efímera y no se podrá actualizar sobre una instalación previa."

      - name: Tests, lint y build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease 2>&1 | tee build.log

      - name: Reportar errores
        if: failure()
        run: |
          grep -E "^e: |Lint found|: Error: " build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          for f in app/build/test-results/*/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for case in root.iter("testcase"):
              for fail in list(case.iter("failure")) + list(case.iter("error")):
                  msg = (fail.get("message") or fail.text or "").splitlines()[0][:300]
                  print(f"::error::{case.get('classname')}.{case.get('name')}: {msg}")
          PY
          done
          if [ -f app/build/reports/lint-results-release.xml ]; then
            python3 - app/build/reports/lint-results-release.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          for issue in ET.parse(sys.argv[1]).getroot().iter("issue"):
              if issue.get("severity") in ("Error", "Fatal"):
                  loc = issue.find("location")
                  where = f"{loc.get('file','').split('/app/')[-1]}:{loc.get('line','')}" if loc is not None else ""
                  print(f"::error::lint {issue.get('id')} {where}: {issue.get('message','')[:240]}")
          PY
          fi

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "bitacora-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: bitacora-${{ github.run_number }}.apk
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint
          path: app/build/reports/lint-results-release.*
          retention-days: 14
          if-no-files-found: ignore

      - name: Limpiar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  secrets:
    name: Claves filtradas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks sobre todo el historial
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1 --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Reportar hallazgos
        if: failure()
        run: |
          [ -f gitleaks.sarif ] && python3 - <<'PY'
          import json
          for run in json.load(open("gitleaks.sarif"))["runs"]:
              for r in run.get("results", []):
                  loc = r["locations"][0]["physicalLocation"]
                  print(f"::error file={loc['artifactLocation']['uri']},line={loc['region']['startLine']}::{r['ruleId']}: posible secreto")
          PY

  sast:
    name: Análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (Kotlin, secretos y workflows)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.183.0 \
            semgrep scan --config p/kotlin --config p/secrets --config p/github-actions \
            --metrics off --error --json --output semgrep.json --exclude app/build
      - name: Reportar hallazgos
        if: failure()
        run: |
          [ -f semgrep.json ] && python3 - <<'PY'
          import json
          for r in json.load(open("semgrep.json")).get("results", []):
              print(f"::error file={r['path']},line={r['start']['line']}::{r['check_id']}: {r['extra']['message'][:240]}")
          PY

  dependencies:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Resolver el árbol de dependencias
        run: |
          if [ ! -f app/gradle.lockfile ]; then
            ./gradlew --no-daemon :app:dependencies --write-locks > /dev/null
            echo "::warning::app/gradle.lockfile no está en el repo; lo generé para este análisis y quedó como artefacto."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockfiles
          path: |
            app/gradle.lockfile
            gradle.lockfile
            settings-gradle.lockfile
          if-no-files-found: ignore
      - name: OSV-Scanner
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.7.0 \
            scan source --lockfile gradle.lockfile:/src/app/gradle.lockfile --format json > osv.json || status=$?
          python3 - <<'PY'
          import json, os
          data = json.load(open("osv.json")) if os.path.exists("osv.json") else {}
          for res in data.get("results", []):
              for pkg in res.get("packages", []):
                  p = pkg["package"]
                  ids = ", ".join(v["id"] for v in pkg.get("vulnerabilities", []))
                  print(f"::error::{p['name']} {p['version']}: {ids}")
          PY
          exit ${status:-0}

  release:
    name: Publicar versión
    needs: [build, secrets, sast, dependencies]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::warning::Sin keystore de firma no se publica la versión."
            exit 0
          fi
          gh release create "v1.0.${{ github.run_number }}" "bitacora-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Bitácora 1.0.${{ github.run_number }}" --notes "Compilada desde ${{ github.sha }} con tests, lint y escaneos de seguridad aprobados." --latest
